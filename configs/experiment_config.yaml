# Experimental configuration matching the manuscript
# Seeds control data partitioning, circuit parameter initialisation, and classical training

seeds: [42, 123, 888]

icu:
  num_qubits: 6
  variational_layers: 3
  entanglement: circular
  encoding: amplitude          # 25-dim features zero-padded to 64
  optimizer: COBYLA
  max_iter: 200
  fidelity_threshold: 0.99
  shots_simulator: 1024
  shots_hardware_ibm: 1000
  readout_error_mitigation: true
  feature_dim: 25

genomic:
  num_qubits: 4
  kernel_shots: 10000          # simulation / kernel estimation shots
  shots_hardware_ibm: 1000
  batch_size: 250
  fidelity_threshold: 0.97
  entanglement: full

radiology:
  num_qubits: 6
  epochs: 200
  batch_size: 16
  psnr_threshold: 30.0
  shots_hardware_ionq: 500
  entanglement: linear

drug_target:
  num_qubits: 6
  shots_hardware_ibm: 1000
  pca_components: 6
  fidelity_threshold: 0.99
  entanglement: circular

safe_service:
  num_qubits: 4
  shots_hardware_ionq: 500
  entanglement: linear

hardware:
  ibm_shots: 1000
  ionq_shots: 500
  readout_error_mitigation: true
  ibm_backends: [ibm_brisbane, ibm_kyoto, ibm_osaka]
  ionq_backends: [ionq_aria-1, ionq_forte-1]
